<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="atlasGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#786fff"/>
      <stop offset="50%" stop-color="#55a8ff"/>
      <stop offset="100%" stop-color="#38d185"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171a23"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="16" stroke="#2b2f3d" stroke-width="1.5"/>

  <!-- Compass / Coordinate Matrix Rings -->
  <circle cx="32" cy="32" r="20" stroke="#3e4458" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="13" stroke="#2b2f3d" stroke-width="1"/>

  <!-- Glowing Compass Needle / Diamond Core -->
  <path d="M32 12L39 32L32 52L25 32Z" fill="url(#atlasGrad)" filter="url(#glow)"/>
  <path d="M12 32L32 39L52 32L32 25Z" fill="url(#atlasGrad)" fill-opacity="0.75"/>

  <!-- Center Pivot Core -->
  <circle cx="32" cy="32" r="4" fill="#ffffff"/>
  <circle cx="32" cy="32" r="2" fill="#0f1117"/>
</svg>
